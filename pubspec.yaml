name: enthem2frontend
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.3 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^4.2.6
  firebase_core: ^2.5.0
  dio: ^5.0.0
  google_sign_in: ^5.4.4
  flutter_bloc: ^8.1.2
  equatable: ^2.0.5
  geocoding: ^2.0.5
  percent_indicator: ^4.2.2
  dotted_border: ^2.0.0+3
  awesome_snackbar_content: ^0.1.2
  transparent_image: ^2.0.1
  flutter_staggered_grid_view: ^0.6.2
  animated_splash_screen: ^1.3.0
  shared_preferences: ^2.0.18
  socket_io_client: ^2.0.1
  rive: ^0.9.1
  flutter_svg: ^1.1.6
  flutter_bounce: ^1.1.0
  lottie: ^2.3.0
  encrypt: ^5.0.1
  flutter_dotenv: ^5.0.2
  sqflite: ^2.2.6
  path_provider: ^2.0.14
  crypto: ^3.0.2
  convert: ^3.1.1
  path: 
  cached_network_image:
  geolocator:
  timeago: 
  intl:
  connectivity: ^3.0.6
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/avaters/
    - assets/Backgrounds/
    - assets/icons/
    - assets/RiveAssets/

 
  fonts:
    - family: Raleway #default font family
      fonts:
        - asset: assets/fonts/Raleway/static/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway/static/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway/static/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway/static/Raleway-Bold.ttf
          weight: 700
    - family: VarelaRound
      fonts:
        - asset: assets/fonts/Varela_Round/VarelaRound-Regular.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo_2/static/Exo2-Regular.ttf
        - asset: assets/fonts/Exo_2/static/Exo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Exo_2/static/Exo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Exo_2/static/Exo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Exo_2/static/Exo2-Black.ttf
          weight: 900
    - family: Intel
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700